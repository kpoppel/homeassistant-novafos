# Service ID
update_token:
  description: Update all loaded Novafos instances, or one selected instance.
  fields:
    config_entry_id:
      name: Integration instance
      description: Optional. Select an instance when using separate logins; otherwise all loaded instances receive the token.
      selector:
        config_entry:
          integration: novafos
    access_token:
      required: true
      example: "ey... long token"
      default: ""
    access_token_date_updated:
      required: true
      example: "2024-01-01T12:34:00"
      default: ""
